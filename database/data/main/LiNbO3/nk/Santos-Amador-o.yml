REFERENCES: |
    A. Santos-Amador, J. Puebla, O. Del Pozo-Zamudio, and R. E. Balderas-Navarro.
    Anisotropic dielectric function of X-, Y-128°, and Z-Cut LiNbO<sub>3</sub> crystals from combined infrared ellipsometry, Raman, and reflectance spectroscopy.
    [*Phys. Rev. Mater.* **10**, 095202 (2026)](https://doi.org/10.1103/1pyn-j9jx)
    (Numerical data kindly provided by Armando Santos-Amador)
COMMENTS: |
COMMENTS: |
    Ordinary ray (o). Congruent LiNbO<sub>3</sub> crystal. Room temperature.
    Optical constants are reported in the mid-infrared spectral range.
    The ordinary dielectric response corresponds to the E-symmetry phonon modes polarized in the xy plane.
    Optical constants were obtained from a factorized TO–LO dielectric function model, constrained and cross-validated using generalized spectroscopic ellipsometry,
    polarized Raman spectroscopy, and infrared reflectance measurements.
    The model describes the dielectric response of X-cut, 128° rotated Y-cut, and Z-cut LiNbO<sub>3</sub> samples through appropriate crystallographic rotations.

CONDITIONS:
    optical_component: o

