    Single-domain bulk BaTiO<sub>3</sub> single crystal (tetragonal *P4mm*, uniaxial at room temperature).
    Extraordinary ray (e), E ∥ c.
    Intrinsic optical constants obtained from a simultaneous analysis of spectroscopic ellipsometry and transmission measurements on a-cut and c-cut samples.
    k = 0 denotes absorption below the detection limit.
