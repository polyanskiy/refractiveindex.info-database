COMMENTS: |
    Equiatomic CrMnFeCoNi (Cantor alloy).
    Bulk sample, arc-melted, annealed 1 month at 1030 °C, polished to 2 nm rms roughness.
    Spectroscopic ellipsometry (Sentech SE 850), averaged over three angles of incidence, n and k from the pseudo-dielectric function.
    Room temperature.
    Relative uncertainty below 1.6 % in n and 1.1 % in k.
    Detector change at 800 nm."
