REFERENCES: |
    A. Santos-Amador, J. Puebla, O. Del Pozo-Zamudio, S. Vazquez-Miranda, and R. E. Balderas-Navarro.
    Optical constants of Co<sub>20</sub>Fe<sub>60</sub>B<sub>20</sub> thin films from mid-infrared to ultraviolet-visible for stratified media modeling.
    [*Thin Solid Films* **839**, 140903 (2026)](https://doi.org/10.1016/j.tsf.2026.140903)
    (Numerical data kindly provided by Armando Santos-Amador)
COMMENTS: |
    Co<sub>20</sub>Fe<sub>60</sub>B<sub>20</sub> thin film, 5 nm thick, deposited by RF magnetron sputtering at room temperature on a Si(100) substrate with a nominal 700 nm thermally grown SiO<sub>2</sub> layer.
    A 10 nm Al<sub>2</sub>O<sub>3</sub> capping layer was deposited by RF sputtering without breaking vacuum.
    Optical constants were determined by spectroscopic ellipsometry.
    Optical constants for a 20 nm Co<sub>20</sub>Fe<sub>60</sub>B<sub>20</sub> film are also reported in the reference.
