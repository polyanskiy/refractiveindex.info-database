NAMES:
  - Cobalt-iron-boron alloy
  - Co-Fe-B
  - CoFeB

ABOUT: |
    CoFeB is a family of ferromagnetic metallic alloys composed of cobalt, iron, and boron. It is commonly deposited as an amorphous thin film and may partially crystallize during annealing. CoFeB is widely used in spintronic devices, particularly as an electrode material in magnetic tunnel junctions. Its physical and optical properties depend on the elemental composition, film thickness, deposition conditions, and thermal history; therefore, CoFeB does not represent a single fixed stoichiometric compound.

